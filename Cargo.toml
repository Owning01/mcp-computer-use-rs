[workspace]
resolver = "3"
members = ["crates/cu-mcp", "crates/cu-native"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "io-std", "sync"] }
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
cu-native = { path = "crates/cu-native" }
